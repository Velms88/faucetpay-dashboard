name: Fetch FaucetPay Faucet List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-faucets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from FaucetPay API via Node.js
        run: |
          node -e '
          const fs = require("fs");

          async function tryFetch(url, body) {
            console.log(`Trying ${url}...`);
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "accept": "application/json, text/plain, */*",
                "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
                "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              },
              body: body
            });
            const text = await response.text();
            try {
              return JSON.parse(text);
            } catch (e) {
              return { status: 500, raw: text };
            }
          }

          async function fetchData() {
            // Эндпоинт 1: /api/v1/getfaucets
            let data = await tryFetch("https://faucetpay.io/api/v1/getfaucets", "currency=BTC");

            // Эндпоинт 2 (резервный): если 1-й вернул ошибку, пробуем альтернативный роут
            if (data.status !== 200) {
              console.log("Endpoint getfaucets failed, trying /api/v1/faucetlist with API key format...");
              data = await tryFetch("https://faucetpay.io/api/v1/faucetlist", "api_key=&currency=BTC");
            }

            console.log("Final API Response Status:", data.status);

            if (data.status !== 200 && !Array.isArray(data.data)) {
              console.error("Failed to fetch valid data from FaucetPay:", JSON.stringify(data));
              process.exit(1);
            }

            const result = {
              fetched_at: new Date().toISOString(),
              data: data
            };

            fs.writeFileSync("faucets.json", JSON.stringify(result, null, 2));
            console.log("Successfully fetched and saved faucets.json!");
          }

          fetchData();
          '

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faucets.json

          if git diff --staged --quiet; then
            echo "No changes in faucets.json, skipping commit."
          else
            git commit -m "chore: update faucets.json [skip ci]"
            git push
          fi
