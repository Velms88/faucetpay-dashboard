name: Fetch FaucetPay Faucet List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-faucets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch from FaucetPay API via Node.js
        run: |
          node -e '
          const fs = require("fs");

          async function fetchData() {
            try {
              // Передаем точные заголовки реального Chrome-браузера
              const response = await fetch("https://faucetpay.io/api/v1/faucetlist", {
                method: "POST",
                headers: {
                  "accept": "application/json, text/plain, */*",
                  "accept-language": "en-US,en;q=0.9",
                  "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
                  "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                },
                body: "currency=BTC"
              });

              const text = await response.text();
              console.log("HTTP Status Code:", response.status);
              console.log("Raw Response Body:", text);

              let data;
              try {
                data = JSON.parse(text);
              } catch (e) {
                console.error("Response is not JSON!");
                process.exit(1);
              }
              
              if (data.status !== 200 && !Array.isArray(data)) {
                console.error("API returned non-200 status inside payload:", data);
                process.exit(1);
              }

              const result = {
                fetched_at: new Date().toISOString(),
                data: data
              };

              fs.writeFileSync("faucets.json", JSON.stringify(result, null, 2));
              console.log("Successfully fetched and saved faucets.json!");
            } catch (err) {
              console.error("Fetch failed:", err);
              process.exit(1);
            }
          }

          fetchData();
          '

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faucets.json

          if git diff --staged --quiet; then
            echo "No changes in faucets.json, skipping commit."
          else
            git commit -m "chore: update faucets.json [skip ci]"
            git push
          fi
