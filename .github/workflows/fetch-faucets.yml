name: Fetch FaucetPay Faucet List

on:
  schedule:
    # Запуск каждый час, но НЕ в 0 минут — ':00' самое загруженное время у
    # GitHub Actions (там скапливаются cron-джобы всех репозиториев мира),
    # и такие запуски чаще всего откладываются или пропускаются.
    - cron: '13 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-faucets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch faucet list from FaucetPay API
        env:
          # Optional: FaucetPay's own docs list api_key as optional for this
          # endpoint. Leave the secret unset if you don't have/need one.
          FAUCETPAY_API_KEY: ${{ secrets.FAUCETPAY_API_KEY }}
        run: |
          set -e

          # This endpoint is called with a plain GET request (confirmed against
          # FaucetPay's own documented usage) - POSTing to it returns
          # {"status":404,"message":"Invalid API method accessed."}
          URL="https://faucetpay.io/api/listv1/faucetlist"
          if [ -n "$FAUCETPAY_API_KEY" ]; then
            URL="${URL}?api_key=${FAUCETPAY_API_KEY}"
          fi

          HTTP_CODE=$(curl -s -o faucets.tmp.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            "$URL")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::FaucetPay API returned HTTP $HTTP_CODE"
            cat faucets.tmp.json || true
            exit 1
          fi

      - name: Validate JSON response
        run: |
          set -e

          if ! jq empty faucets.tmp.json 2>/dev/null; then
            echo "::error::Response is not valid JSON, aborting."
            cat faucets.tmp.json || true
            exit 1
          fi

          # FaucetPay can return HTTP 200 while embedding its own error code
          # (e.g. 403 invalid api_key, 301 access denied) inside the JSON body.
          BODY_STATUS=$(jq -r '.status // empty' faucets.tmp.json)
          if [ -n "$BODY_STATUS" ] && [ "$BODY_STATUS" != "200" ]; then
            BODY_MESSAGE=$(jq -r '.message // "no message"' faucets.tmp.json)
            echo "::error::FaucetPay API responded with status $BODY_STATUS: $BODY_MESSAGE"
            exit 1
          fi

          mv faucets.tmp.json faucets.json

      - name: Stamp fetch metadata
        run: |
          TMP=$(mktemp)
          jq --arg ts "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
             '{ fetched_at: $ts, data: . }' faucets.json > "$TMP"
          mv "$TMP" faucets.json

      - name: Enrich with Health Score and Rating
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          COINGECKO_API: ${{ secrets.COINGECKO_API }}
        run: |
          if [ -n "$TURSO_URL" ]; then echo "TURSO_URL: set"; else echo "::error::TURSO_URL secret is NOT set"; fi
          if [ -n "$TURSO_TOKEN" ]; then echo "TURSO_TOKEN: set"; else echo "::error::TURSO_TOKEN secret is NOT set"; fi
          if [ -n "$COINGECKO_API" ]; then echo "COINGECKO_API: set"; else echo "COINGECKO_API: NOT set (CoinGecko will use anonymous/public quota)"; fi
          node build_faucets.js --fetch-prices

      # Enriched data is also written to Turso by the Enrich step above
      # (build_faucets.js); the static site reads from Turso. We still
      # keep the freshly fetched faucets.json committed to the repo as the
      # canonical API-input source.
      # build_faucets.js ALSO writes ./data.json (статичный snapshot для
      # мгновенной загрузки фронтенда). Его тоже нужно закоммитить/запушить,
      # иначе он сгенерируется в раннере и пропадёт — сайт его не увидит.
      # The [skip ci] commit message prevents this push from re-triggering
      # the workflow.
      - name: Commit and push faucets.json + data.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faucets.json
          # data.json генерится не всегда (если build_faucets упал до записи) —
          # добавляем только при наличии файла, чтобы не ломать коммит.
          if [ -f data.json ]; then git add data.json; fi
          if git diff --cached --quiet; then
            echo "faucets.json unchanged — nothing to commit"
          else
            git commit -m "chore: refresh faucets.json + data.json [skip ci]"
            # Rebase onto the latest remote state before pushing. Оба файла
            # (faucets.json и data.json) полностью перегенерируются build_faucets.js
            # на КАЖДОМ запуске, поэтому наша локальная копия — авторитетная.
            # При конфликте оставляем НАШУ версию (-X theirs в rebase сохраняет
            # "theirs", которым в rebase является реплицируемый коммит).
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" \
              || {
                   git checkout --theirs -- faucets.json
                   git add faucets.json
                   if [ -f data.json ]; then git checkout --theirs -- data.json; git add data.json; fi
                   git rebase --continue --no-edit
                 }
            git push origin "${GITHUB_REF_NAME}"
          fi

