name: Run Sandbox Test (dry-run)

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: 'Commit generated sandbox files to the repo'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

concurrency:
  group: sandbox-test
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run sandbox pipeline (mock data only)
        run: |
          node build_faucets.js --mode=sandbox

      - name: Verify production files were not touched
        run: |
          if git diff --name-only | grep -E '^(faucets\.json|history\.json|faucet_config\.json)$'; then
            echo "::error::Sandbox run modified production files!"
            exit 1
          fi
          echo "Production files untouched. OK."

      - name: Commit sandbox results if requested
        if: ${{ github.event.inputs.commit_results == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faucets.sandbox.json history.sandbox.json

          if git diff --staged --quiet; then
            echo "No changes in sandbox files, skipping commit."
          else
            git commit -m "chore: update sandbox test data [skip ci]"
            git pull --rebase origin main
            git push
          fi