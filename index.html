<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaucetPay Monitor</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="container">

    <div class="topbar">
      <div>
        <h1>💧 FaucetPay Monitor</h1>
        <p class="subtitle">Автоматический мониторинг кранов FaucetPay (обновление каждый час)</p>
      </div>

      <div class="stats-wrapper">
        <div class="stat-card">
          <div class="label">Записей</div>
          <div id="record-count" class="value">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Обновлено</div>
          <div id="last-updated" class="value">—</div>
        </div>
        <button id="refresh-btn" class="btn">⟳ Обновить</button>
      </div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div id="faucet-table"></div>

    <p class="footer-note">Данные предоставлены публичным API FaucetPay. Файл faucets.json обновляется автоматически через GitHub Actions.</p>
  </div>

  <!-- ?v=4 — cache-buster: меняйте версию при каждом деплое, чтобы браузеры подхватывали новую версию app.js -->
  <script src="./app.js?v=4"></script>
</body>
</html>
