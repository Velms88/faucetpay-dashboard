<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaucetPay Monitor</title>
<link rel="stylesheet" href="./style.css?v=5">
</head>
<body>

  <div class="container">

    <div class="topbar">
      <div class="topbar-header">
        <h1>💧 FaucetPay Monitor</h1>
        <p class="subtitle">Автоматический мониторинг кранов FaucetPay (обновление каждый час)</p>
      </div>

      <div class="topbar-actions">
        <div id="admin-buttons" class="admin-buttons">
          <button id="admin-real-btn" type="button" class="btn admin-btn">⚙️ Админпанель</button>
        </div>
        <button id="refresh-btn" class="btn">⟳ Обновить</button>
      </div>
    </div>

    <div class="controls-row">
      <div class="search-group">
        <div class="page-search">
          <input id="name-search" class="search-input" type="search" placeholder="Поиск по названию..." />
        </div>
        <button id="force-fresh-btn" class="btn" title="Админ: загрузить полный дамп из Turso напрямую (минуя data.json)">⚡ Turso (admin)</button>
      </div>

      <div class="stats-wrapper">
        <div class="stat-card">
          <div class="label">Записей</div>
          <div id="record-count" class="value">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Обновлено</div>
          <div id="last-updated" class="value">—</div>
        </div>
      </div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div id="admin-root"></div>

    <div id="faucet-table"></div>

    <p class="footer-note">Данные предоставлены публичным API FaucetPay. Файл faucets.json обновляется автоматически через GitHub Actions.</p>
  </div>
  <script src="./auth_config.js"></script>
  <!-- ?v=7 — cache-buster: меняйте версию при каждом деплое, чтобы браузеры подхватывали новую версию app.js -->
   <script src="./cryptoPrices.js?v=1"></script>
    <script src="./app.js?v=25"></script>
</body>
</html>
